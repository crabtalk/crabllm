[package]
name = "crabllm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core types for the crabllm LLM API gateway"
keywords = ["llm", "openai", "api", "types", "gateway"]
categories = ["data-structures", "web-programming"]

[features]
default = ["std"]
std = [
    "dep:tokio",
    "dep:wstd",
    "dep:rand",
    "bytes/std",
    "futures-core/std",
    "futures-util/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
]
gateway = ["std", "toml"]
openapi = ["utoipa"]
sonic = ["std", "dep:sonic-rs"]

[dependencies]
# crates-io
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
hashbrown.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand = { workspace = true, optional = true }
sonic-rs = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
tokio = { workspace = true, features = ["time"], optional = true }

# `Retrying`'s timers under WASI, where there is no tokio runtime to drive them.
[target.'cfg(target_os = "wasi")'.dependencies]
wstd = { workspace = true, optional = true }
