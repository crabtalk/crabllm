name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
      # - name: Install Toolchain
      #   run: rustup update stable && rustup default stable
      # - name: Install protoc
      #   uses: arduino/setup-protoc@v3
      # - uses: taiki-e/install-action@sccache
      # - uses: taiki-e/install-action@nextest
      - name: Build
        run: cargo build -p crabllm

      # - name: Run Tests
      #   run: cargo nextest run --workspace --no-fail-fast --release

  check:
    name: Check
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
      # - name: Install Toolchain
      #   run: |
      #     rustup update stable && rustup default stable
      #     rustup component add clippy rustfmt
      # - name: Install protoc
      #   uses: arduino/setup-protoc@v3
      - uses: taiki-e/install-action@sccache
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all -- -D warnings

  no-std:
    name: No-std
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@sccache
      - name: Install Guest Targets
        run: rustup target add wasm32-unknown-unknown riscv64imac-unknown-none-elf
      - name: Check wasm32
        run: cargo check -p crabllm-core --no-default-features --target wasm32-unknown-unknown
      - name: Check riscv64
        run: cargo check -p crabllm-core --no-default-features --target riscv64imac-unknown-none-elf

  typos:
    name: Typos
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
      - name: Check Typos
        run: typos
