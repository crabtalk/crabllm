name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p crabllm

      # - name: Run Tests
      #   run: cargo nextest run --workspace --no-fail-fast --release

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all -- -D warnings

  no-std:
    name: No-std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Check wasm32
        run: cargo check -p crabllm-core --no-default-features --target wasm32-unknown-unknown
      - name: Check riscv64
        run: cargo check -p crabllm-core --no-default-features --target riscv64imac-unknown-none-elf

  wasi:
    name: WASI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Check crabllm-sdk
        run: cargo check -p crabllm-sdk --target wasm32-wasip2

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@typos
      - name: Check Typos
        run: typos
